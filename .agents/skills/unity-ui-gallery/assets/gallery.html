<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Галерея UI</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#12161f;color:#edf2fa}*{box-sizing:border-box}body{margin:0}header,main,footer{padding:22px 4vw}h1{font-size:32px}h2{font-size:23px;margin:0}p{line-height:1.5;color:#b7c4da}a{color:#b8d0ff}button,input,select{font:inherit}button{cursor:pointer}input,select{padding:10px;background:#252e40;color:white;border:1px solid #52617b;border-radius:5px}nav{position:sticky;top:0;z-index:2;display:flex;gap:12px;flex-wrap:wrap;background:#12161ff2;padding:14px 4vw;border-block:1px solid #354157}input{flex:1}section{padding:20px 0 35px;border-bottom:1px solid #354157;scroll-margin-top:80px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}figure{margin:0;background:#202838;border:1px solid #394963;border-radius:7px;overflow:hidden}.shot{padding:0;border:0;display:block;width:100%;background:#080b10}.shot img{display:block;width:100%;height:auto}figcaption{padding:13px;font-size:15px}small{display:block;margin-top:8px;line-height:1.4;color:#a9bad4;overflow-wrap:anywhere}.missing{padding:35px;color:#ffca94}.warning{border-left:4px solid #e8b85c;padding-left:15px}.source{font-size:12px}dialog{background:#12161f;color:white;width:98vw;max-width:1700px;border:1px solid #52617b;border-radius:7px}dialog::backdrop{background:#000d}dialog img{width:100%;max-height:82vh;object-fit:contain}.bar{display:flex;gap:12px;align-items:center;padding-bottom:12px}.bar b{flex:1}.bar button{background:#303e55;border:0;border-radius:4px;color:white;padding:8px 12px}[hidden]{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:26px}}
</style>
<header><h1 id="title"></h1><p id="summary"></p><p id="status"></p><p>Реальный Unity UI с подготовленными состояниями. Способ подготовки указан у каждого кадра. Нажмите на изображение для увеличения.</p><a href="manifest.json">Манифест и данные съёмки</a></header>
<nav><select id="case" aria-label="Кейс"><option value="">Все кейсы</option></select><input type="search" id="search" placeholder="Кейс или состояние…" aria-label="Поиск"></nav>
<main id="cases"></main><footer>← → — переключить кадр. Esc — закрыть. PNG — оригинал без обработки.</footer>
<dialog id="viewer"><div class="bar"><button id="prev" aria-label="Предыдущий">←</button><button id="next" aria-label="Следующий">→</button><b id="caption"></b><a id="original" target="_blank" rel="noopener">PNG</a><button id="close" aria-label="Закрыть">✕</button></div><img id="large" alt=""></dialog>
<script type="application/json" id="data">__GALLERY_DATA__</script>
<script>
const data=JSON.parse(document.querySelector('#data').textContent),q=s=>document.querySelector(s),node=(tag,text)=>{const e=document.createElement(tag);if(text)e.textContent=text;return e};
document.title=data.title;q('#title').textContent=data.title;q('#summary').textContent=`${data.cases.length} кейсов · ${data.captured} из ${data.expected} кадров · версия ${(data.revision||'не указана').slice(0,8)}`;
q('#status').textContent=data.complete?'Съёмка завершена. Исходная сессия восстановлена.':'Набор неполный или восстановление требует проверки. Подробности: run.json и capture-result.json.';if(!data.complete)q('#status').className='warning';
const shots=[];
for(const c of data.cases){const option=node('option',c.title);option.value=c.id;q('#case').append(option);const section=node('section');section.id=c.id;section.append(node('h2',c.title));const source=node('p',c.source);source.className='source';section.append(source);const grid=node('div');grid.className='grid';for(const s of c.states){const figure=node('figure');if(s.captured){const button=node('button');button.className='shot';const img=node('img');img.src=s.file;img.alt=s.title;img.loading='lazy';img.width=s.width;img.height=s.height;button.append(img);button.onclick=()=>openShot(shots.findIndex(x=>x.s.id===s.id));figure.append(button);shots.push({s,c,section});}else{const missing=node('div',s.error||'Не снято');missing.className='missing';figure.append(missing);}const caption=node('figcaption',s.title);caption.append(node('small',[s.note,s.method].filter(Boolean).join(' · ')));caption.append(node('small',s.captured?`${s.width} × ${s.height} · ${s.file}`:'Ожидает съёмки'));figure.append(caption);grid.append(figure);}section.append(grid);q('#cases').append(section);}
function filter(){for(const s of q('#cases').children)s.hidden=!!q('#case').value&&s.id!==q('#case').value||!s.textContent.toLowerCase().includes(q('#search').value.toLowerCase());}q('#case').onchange=filter;q('#search').oninput=filter;
let index=0;function openShot(i){if(!shots.length)return;index=(i+shots.length)%shots.length;const {s,c}=shots[index];q('#large').src=s.file;q('#large').alt=s.title;q('#caption').textContent=c.title+' — '+s.title;q('#original').href=s.file;if(!q('#viewer').open)q('#viewer').showModal();}function move(step){let next=index;for(let n=0;n<shots.length;n++){next=(next+step+shots.length)%shots.length;if(!shots[next].section.hidden){openShot(next);break;}}}q('#prev').onclick=()=>move(-1);q('#next').onclick=()=>move(1);q('#close').onclick=()=>q('#viewer').close();document.addEventListener('keydown',e=>{if(q('#viewer').open){if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);}});
</script></html>
